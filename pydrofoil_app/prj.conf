CONFIG_SERIAL=y
CONFIG_UART_PYDROFOIL=y
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_RISCV_PMP=n
# CONFIG_PLIC=n
CONFIG_PLIC=n
CONFIG_MULTI_LEVEL_INTERRUPTS=n
# --- MULTICORE SMP SETTINGS ---
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2

# Optional but highly recommended for debugging:
# This lets you see which core is running which thread
CONFIG_THREAD_NAME=y