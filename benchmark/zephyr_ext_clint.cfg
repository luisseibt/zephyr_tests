### vcml-pydrofoil (branch multicore_ext_clint) configuration for the Zephyr app
# The VP has system.ncores cores named core0 ... core<ncores-1>, hart id =
# index. ncores must match the Zephyr build (CONFIG_MP_MAX_NUM_CPUS, NRCPU in
# the board devicetree, NUM_CORES in main.c).

system.name       = zephyr-pydrofoil32
system.config     = ${cfg}

system.ncores = 8

system.throttle.rtf = 0
system.quantum      = 100ns
system.duration     = 10000000000s

# CPU clock / CLINT clock = instructions per mtime tick (here 1 GHz / 10 MHz
# = 100). clk_clint must match CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC (10 MHz).
system.clk_cpu.hz   = 1000000000 # 1 GHz
system.clk_clint.hz = 10000000   # 10 MHz

### CPU configuration ########################################################
for i : ${system.ncores} do
system.core${i}.arch_name = "rv32"
system.core${i}.verbose   = false
system.core${i}.trace     = 0
system.core${i}.async     = false

# Pydrofoil intercepts its HTIF tohost/fromhost words before any memory access;
# the default 0x80001000 lies inside Zephyr's code. Move it out of the RAM.
system.core${i}.htif_tohost = 0x900F0000

system.core${i}.pc      = 0x80000000
system.core${i}.symbols = ${dir}/build/zephyr/zephyr.elf
system.core${i}.elf     = ${dir}/build/zephyr/zephyr.elf
done

system.core0.gdb_port = 5555
system.core0.gdb_wait = false

system.loader.images = ${dir}/build/zephyr/zephyr.elf

### Physical address map #####################################################
# Must agree with zephyr_tests/boards/pydrofoil_32/*.dts
system.ram          = 0x80000000..0x8FFFFFFF
system.addr_uart0   = 0x10000000..0x10000FFF   # nrf51 UART, PLIC source 5
system.addr_plic    = 0x0C000000..0x0C224FFE   # contexts 2i (M) / 2i+1 (S) per hart
system.addr_clint   = 0x04000000..0x0400FFFF   # mtimecmp +0x4000, mtime +0xBFF8
system.addr_simdev  = 0x1E203000..0x1E203FFF   # vcml simdev (exit at +0x08)
system.addr_multicore_simdev = 0x1C203000..0x1C203FFF   # core_done +0x00, hclk +0x20
system.multicore_simdev.write_to_file = false

# The VP's ns16550a defaults to 0x10000000 and would collide with uart0
system.addr_uart8250 = 0x0D000000..0x0D000FFF

### Terminals ################################################################
system.term.backends     = stdout
system.term8250.backends = null
